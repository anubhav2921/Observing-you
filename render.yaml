services:
  - type: web
    name: ai-study-monitor
    runtime: python
    region: oregon
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
